<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent IA Rust Local</title>
<script src="/marked.min.js"></script>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; display: flex; flex-direction: column; height: 100vh; }
  header { background: #1e293b; padding: 0.9rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; gap: 1rem; }
  header h1 { margin: 0; font-size: 1.15rem; color: #38bdf8; }
  .controls { display: flex; align-items: center; gap: 0.7rem; }
  select { background: #0f172a; color: #f8fafc; border: 1px solid #475569; padding: 0.45rem 0.8rem; border-radius: 6px; font-size: 0.9rem; cursor: pointer; }
  button.secondary { background: #334155; color: white; border: 1px solid #475569; padding: 0.45rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
  button.clear { background: #ef4444; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
  #docsBar { background: #162032; padding: 0.5rem 1.5rem; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; border-bottom: 1px solid #334155; font-size: 0.85rem; }
  #docsBar:empty { display: none; }
  .doc-pill { background: #1e293b; border: 1px solid #475569; padding: 0.25rem 0.6rem; border-radius: 999px; display: inline-flex; align-items: center; gap: 0.5rem; color: #e2e8f0; }
  .doc-pill button { background: none; border: none; color: #f87171; font-weight: bold; cursor: pointer; font-size: 1rem; padding: 0; line-height: 1; }
  .doc-pill button:hover { color: #ef4444; }
  #chat { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; max-width: 900px; width: 100%; margin: 0 auto; box-sizing: border-box; }
  .msg { padding: 0.9rem 1.2rem; border-radius: 10px; max-width: 85%; line-height: 1.6; overflow-wrap: break-word; }
  .user { background: #2563eb; align-self: flex-end; white-space: pre-wrap; }
  .assistant { background: #1e293b; align-self: flex-start; border: 1px solid #334155; }
  .assistant p:first-child { margin-top: 0; }
  .assistant p:last-child { margin-bottom: 0; }
  .assistant pre { background: #020617; padding: 0.9rem; border-radius: 8px; overflow-x: auto; border: 1px solid #334155; }
  .assistant code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; background: rgba(15, 23, 42, 0.7); padding: 0.15rem 0.35rem; border-radius: 4px; }
  .assistant pre code { background: transparent; padding: 0; }
  .tool-badge { font-size: 0.8rem; color: #38bdf8; background: #0f172a; padding: 0.3rem 0.6rem; border-radius: 6px; margin-bottom: 0.6rem; display: inline-block; font-family: monospace; border: 1px solid #334155; }
  form { background: #1e293b; padding: 1rem; display: flex; gap: 0.8rem; border-top: 1px solid #334155; }
  .input-wrap { max-width: 900px; width: 100%; margin: 0 auto; display: flex; gap: 0.8rem; }
  input[type="text"] { flex: 1; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; }
  button.attach { background: #334155; color: white; border: 1px solid #475569; padding: 0 1rem; border-radius: 8px; cursor: pointer; font-size: 1.2rem; }
  button.send { background: #38bdf8; color: #0f172a; border: none; padding: 0 1.5rem; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>🦀 Agent IA Rust</h1>
  <div class="controls">
    <select id="modelSelect" title="Choisir le modèle Ollama"></select>
    <button id="reloadBtn" class="secondary" onclick="reloadDocs()" title="Réindexer le dossier documents/">🔄 Docs</button>
    <button class="clear" onclick="clearChat()">Effacer</button>
  </div>
</header>
<div id="docsBar"></div>
<div id="chat"></div>
<form id="form">
  <div class="input-wrap">
    <input type="file" id="fileInput" style="display:none" multiple onchange="uploadFiles(this.files)" />
    <button type="button" class="attach" onclick="document.getElementById('fileInput').click()" title="Déposer un fichier (PDF, texte, code...)">📎</button>
    <input type="text" id="input" placeholder="Posez une question ou déposez un fichier avec 📎..." autocomplete="off" required />
    <button type="submit" class="send" id="btn">Envoyer</button>
  </div>
</form>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const btn = document.getElementById('btn');
const modelSelect = document.getElementById('modelSelect');
const docsBar = document.getElementById('docsBar');

async function loadModels() {
  try {
    const res = await fetch('/api/models');
    const models = await res.json();
    modelSelect.innerHTML = '';
    models.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m;
      opt.textContent = m;
      modelSelect.appendChild(opt);
    });
  } catch (e) {
    modelSelect.innerHTML = '<option value="llama3.2:3b">llama3.2:3b</option>';
  }
}

async function refreshDocsList() {
  try {
    const res = await fetch('/api/docs');
    const files = await res.json();
    docsBar.innerHTML = '';
    if (files.length > 0) {
      const label = document.createElement('span');
      label.style.color = '#94a3b8';
      label.textContent = 'Fichiers actifs :';
      docsBar.appendChild(label);

      files.forEach(f => {
        const pill = document.createElement('span');
        pill.className = 'doc-pill';
        const nameSpan = document.createElement('span');
        nameSpan.textContent = '📄 ' + f;

        const delBtn = document.createElement('button');
        delBtn.textContent = '×';
        delBtn.title = 'Supprimer ' + f;
        delBtn.onclick = () => deleteDoc(f);

        pill.appendChild(nameSpan);
        pill.appendChild(delBtn);
        docsBar.appendChild(pill);
      });
    }
  } catch (e) {}
}

async function deleteDoc(filename) {
  await fetch('/api/docs/' + encodeURIComponent(filename), { method: 'DELETE' });
  refreshDocsList();
}

async function reloadDocs() {
  const rBtn = document.getElementById('reloadBtn');
  rBtn.textContent = '⏳ Indexation...';
  try {
    const res = await fetch('/api/reload-docs', { method: 'POST' });
    const count = await res.json();
    rBtn.textContent = `✅ ${count} blocs`;
    refreshDocsList();
  } catch (e) {
    rBtn.textContent = '❌ Erreur';
  } finally {
    setTimeout(() => { rBtn.textContent = '🔄 Docs'; }, 2500);
  }
}

function renderUploadBubble(files, chunks) {
  const infoBubble = createMessageBubble('user');
  infoBubble.content.textContent = `📎 Fichier(s) déposé(s) : ${files.join(', ')} (${chunks} segments indexés)`;

  files.forEach(name => {
    if (/\.(jpg|jpeg|png|webp|gif)$/i.test(name)) {
      const img = document.createElement('img');
      img.src = '/docs/' + encodeURIComponent(name);
      img.style.maxWidth = '280px';
      img.style.borderRadius = '8px';
      img.style.marginTop = '0.6rem';
      img.style.display = 'block';
      // Masque l'image proprement si le fichier a été supprimé via la croix ×
      img.onerror = () => { img.style.display = 'none'; };
      infoBubble.content.appendChild(img);
    }
  });
}

async function uploadFiles(files) {
  if (!files || !files.length) return;
  const formData = new FormData();
  for (const file of files) {
    formData.append('file', file);
  }

  const infoBubble = createMessageBubble('user');
  infoBubble.content.textContent = '📤 Envoi et indexation en cours...';

  try {
    const res = await fetch('/api/upload', { method: 'POST', body: formData });
    const data = await res.json();
    infoBubble.content.textContent = `📎 Fichier(s) déposé(s) : ${data.files.join(', ')} (${data.chunks} segments indexés)`;

    data.files.forEach(name => {
      if (/\.(jpg|jpeg|png|webp|gif)$/i.test(name)) {
        const img = document.createElement('img');
        img.src = '/docs/' + encodeURIComponent(name);
        img.style.maxWidth = '280px';
        img.style.borderRadius = '8px';
        img.style.marginTop = '0.6rem';
        img.style.display = 'block';
        infoBubble.content.appendChild(img);
      }
    });

    refreshDocsList();
  } catch (err) {
    infoBubble.content.textContent = '❌ Erreur lors du dépôt du fichier.';
  } finally {
    document.getElementById('fileInput').value = '';
  }
}

document.body.addEventListener('dragover', e => e.preventDefault());
document.body.addEventListener('drop', e => {
  e.preventDefault();
  if (e.dataTransfer.files.length) {
    uploadFiles(e.dataTransfer.files);
  }
});

function createMessageBubble(role) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const content = document.createElement('div');
  div.appendChild(content);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return { div, content };
}

function renderText(role, element, text) {
  if (role === 'assistant') {
    if (text.trim().startsWith('{')) {
      element.innerHTML = '<em>Analyse de l\'action en cours...</em>';
    } else {
      element.innerHTML = (typeof marked !== 'undefined') ? marked.parse(text) : text;
    }
  } else {
    element.textContent = text;
  }
  chat.scrollTop = chat.scrollHeight;
}

async function loadHistory() {
  const res = await fetch('/api/history');
  const data = await res.json();
  chat.innerHTML = '';
  data.forEach(m => {
    if (m.role === 'upload') {
      try {
        const info = JSON.parse(m.content);
        renderUploadBubble(info.files, info.chunks);
      } catch (e) {}
      return;
    }
    const isToolCall = m.role === 'assistant' && m.content.trim().startsWith('{') && m.content.trim().endsWith('}');
    if (m.role !== 'system' && !m.content.startsWith("Résultat de l'outil") && !isToolCall) {
      const { content } = createMessageBubble(m.role);
      renderText(m.role, content, m.content);
    }
  });
}

async function clearChat() {
  await fetch('/api/clear', { method: 'POST' });
  chat.innerHTML = '';
}

form.onsubmit = async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  const userBubble = createMessageBubble('user');
  renderText('user', userBubble.content, text);

  btn.disabled = true;
  btn.textContent = 'Génération...';

  const aiBubble = createMessageBubble('assistant');
  let rawText = '';

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, model: modelSelect.value })
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const payload = JSON.parse(line.slice(6));
          if (payload.type === 'chunk') {
            rawText += payload.text;
            renderText('assistant', aiBubble.content, rawText);
          } else if (payload.type === 'tool') {
            const badge = document.createElement('div');
            badge.className = 'tool-badge';
            badge.textContent = '⚙️ Outil déclenché : ' + payload.name;
            aiBubble.div.insertBefore(badge, aiBubble.content);
            rawText = '';
            aiBubble.content.innerHTML = '<em>Lecture du résultat...</em>';
          }
        }
      }
    }
  } catch (err) {
    aiBubble.content.textContent = 'Erreur de connexion au serveur Rust.';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Envoyer';
  }
};

loadModels();
refreshDocsList();
loadHistory();
</script>
</body>
</html>
