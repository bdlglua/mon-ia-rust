[package]
name = "mon-ia-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
genai = "0.1"
serde_json = "1"
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"
serde = { version = "1.0.229", features = ["derive"] }
scraper = "0.29.0"
axum = { version = "0.8.9", features = ["multipart"] }
async-stream = "0.3.6"
pdf-extract = "0.12.1"
base64 = "0.23.1"
